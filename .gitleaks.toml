# gitleaks: varsayılan kurallar + bilinen test verisi (sır değil; yayın hattı ikinci göz olarak çalıştırır).
[extend]
useDefault = true

[allowlist]
description = "Test verisi: sentetik WireGuard anahtarı (okunur ASCII metnin base64 hâli)"
regexes = ['''MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=''', '''0123456789abcdef0123456789abcdef''']
